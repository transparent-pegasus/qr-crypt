<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F172A" />
    <!-- Referrer-Policy is served from public/_headers, but a Route A install
         is served by whatever static server the operator chose, and most
         ignore _headers. This is the only one of those six headers with a real
         meta equivalent; the rest have none. See docs/security/threat-model.md §2. -->
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Offline encryption PWA: keys and messages stay on a device you keep permanently offline, and ciphertext crosses to your online phone only as a QR code."
    />
    <title>QR Crypt — Offline Encryption</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
