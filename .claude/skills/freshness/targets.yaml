# Freshness registry — every tracked file in this repo whose content decays
# with time (package versions, advisories, threat knowledge, dated claims).
# Consumed by SKILL.md in this directory. One unit = one coherent update
# operation; a file may appear in several units.
#
# Field semantics:
#   cadence_days   review interval; a unit is DUE when today - last_checked
#                  >= cadence_days, or when last_checked is null.
#   last_checked   YYYY-MM-DD stamped by a sweep AFTER verify passes,
#                  even when no content change was needed. null = never swept.
#   method         how to refresh (commands are aube — npm is forbidden here).
#   verify         must pass before stamping last_checked.
#   sync           unit ids whose docs must absorb findings from this unit.
#   constraint     hard rule that bounds HOW the unit may be updated.
#
# Registry maintenance: any task that adds a new time-decaying file must add
# it here (enforced by the one-line rule in /AGENTS.md).

version: 1
updated: 2026-07-29 # last revision of this registry itself

units:
  - id: deps
    category: dependencies
    cadence_days: 14
    last_checked: 2026-07-27
    files:
      - package.json
      - aube-lock.yaml
      - vite.config.ts # PWA/workbox options reviewed on plugin bumps; globPatterns must keep `wasm`
      - public/_headers # script-src carries 'wasm-unsafe-eval' for the zxing-wasm reader
      - src/qr/camera/reader-module.ts # same-origin locateFile routing for the reader wasm
    why: >
      Dependency ranges, exact security pins, aube.overrides, and the frozen
      lock graph fall behind registry releases and advisories.
    method: |
      aube outdated && aube audit
      Routine in-range bumps: aube update <pkg>; cross-range or exact-pin
      moves (only when approved): aube update --latest [--exact] <pkg>;
      commit the resulting aube-lock.yaml.
      Exact pins stay exact until re-vetted:
        - "@noble/post-quantum" — handled ONLY via unit crypto-noble.
        - zxing-wasm — on any bump, recompute the reader wasm SHA-256 and size,
          re-check the upstream zxing-cpp commit, and update the record in
          docs/security/security-review.md §1. Confirm the asset still resolves
          same-origin (no CDN) and stays precached, and that
          tests/e2e/security.spec.ts still pins 'wasm-unsafe-eval' present and
          bare 'unsafe-eval' absent.
        - react-hook-form 7.82.0, eslint-config-prettier 10.1.8 — supply-chain
          incident history in docs/security/threat-model.md §5.1; re-check advisories
          before moving.
      aube.overrides (rollup OMT) stays until upstream trust is restored.
      After bumping vite-plugin-pwa / workbox, re-review the VitePWA options in
      vite.config.ts (globPatterns, cleanupOutdatedCaches, sentinel NetworkOnly).
    verify: aube ci && aube run typecheck && aube run lint && aube run test && aube run build:prod
    sync: [threat-model, security-review]

