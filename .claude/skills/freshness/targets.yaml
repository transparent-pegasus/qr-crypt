    why: >
      The PQ provider pin (0.6.1) is the security-critical dependency. New noble
      releases, independent-audit status changes, and NIST FIPS 203/204 errata
      all stale the pin and the size-table/API comments that mirror it.
    method: |
      Check @noble/post-quantum releases + advisories and NIST FIPS 203/204
