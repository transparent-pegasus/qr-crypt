# Freshness registry — every tracked file in this repo whose content decays
# with time (package versions, advisories, threat knowledge, dated claims).
# Consumed by SKILL.md in this directory. One unit = one coherent update
# operation; a file may appear in several units.
#
# Field semantics:
#   cadence_days   review interval; a unit is DUE when today - last_checked
#                  >= cadence_days, or when last_checked is null.
#   last_checked   YYYY-MM-DD stamped by a sweep AFTER verify passes,
#                  even when no content change was needed. null = never swept.
#   method         how to refresh (commands are aube — npm is forbidden here).
#   verify         must pass before stamping last_checked.
#   sync           unit ids whose docs must absorb findings from this unit.
#   constraint     hard rule that bounds HOW the unit may be updated.
#
# Registry maintenance: any task that adds a new time-decaying file must add
# it here (enforced by the one-line rule in /AGENTS.md).

version: 1
updated: 2026-07-26 # last revision of this registry itself

units:
  - id: deps
    category: dependencies
    cadence_days: 14
    last_checked: 2026-07-26
    files:
      - package.json
      - aube-lock.yaml
      - vite.config.ts # PWA/workbox options reviewed on plugin bumps; globPatterns must keep `wasm`
      - public/_headers # script-src carries 'wasm-unsafe-eval' for the zxing-wasm reader
      - src/qr/decode.ts # same-origin locateFile routing for the reader wasm
    why: >
      Dependency ranges, exact security pins, aube.overrides, and the frozen
      lock graph fall behind registry releases and advisories.
    method: |
      aube outdated && aube audit
      Routine in-range bumps: aube update <pkg>; cross-range or exact-pin
      moves (only when approved): aube update --latest [--exact] <pkg>;
      commit the resulting aube-lock.yaml.
      Exact pins stay exact until re-vetted:
        - "@noble/post-quantum" — handled ONLY via unit crypto-noble.
        - zxing-wasm — on any bump, recompute the reader wasm SHA-256 and size,
          re-check the upstream zxing-cpp commit, and update the record in
          docs/security/security-review.md §1. Confirm the asset still resolves
          same-origin (no CDN) and stays precached, and that
          tests/e2e/security.spec.ts still pins 'wasm-unsafe-eval' present and
          bare 'unsafe-eval' absent.
        - react-hook-form 7.82.0, eslint-config-prettier 10.1.8 — supply-chain
          incident history in docs/security/threat-model.md §5.1; re-check advisories
          before moving.
      aube.overrides (rollup OMT) stays until upstream trust is restored.
      After bumping vite-plugin-pwa / workbox, re-review the VitePWA options in
      vite.config.ts (globPatterns, cleanupOutdatedCaches, sentinel NetworkOnly).
    verify: aube ci && aube typecheck && aube lint && aube test && aube build:prod
    sync: [threat-model, security-review]

  - id: crypto-noble
    category: crypto
    cadence_days: 90 # also triggered by any @noble/post-quantum advisory/release
    last_checked: 2026-07-25
    files:
      - package.json # "@noble/post-quantum" exact pin
      - aube-lock.yaml # frozen graph must move with the pin
      - src/crypto/pq/provider-noble.ts # API-surface header comments
      - src/crypto/pq/profiles.ts # FIPS 203/204 size tables
      - docs/security/security-review.md # §1 as-of version / audit status
    why: >
      The PQ provider pin (0.6.1) is the security-critical dependency. New noble
      releases, independent-audit status changes, and NIST FIPS 203/204 errata
      all stale the pin and the size-table/API comments that mirror it.
    method: |
      Check @noble/post-quantum releases + advisories and NIST FIPS 203/204
      errata. If bumping: update the exact pin, re-read the changelog/API,
      review the resulting aube-lock.yaml diff (noble transitive graph,
      provenance), refresh provider-noble.ts header comments, diff
      KEM_SIZES/DSA_SIZES/PQ_PROFILES in profiles.ts against the new source,
      update docs/security/security-review.md §1 (version, as-of date, audit status).
    verify: aube audit && aube test:pq && aube test:pq-vectors && aube bench:pq
    constraint: >
      Never bump the pin without KAT (test:pq-vectors) and golden passes.
      Size tables are append-only: retired profiles keep their rows.
    sync: [security-review, threat-model, ui-security-copy, readme]

  - id: toolchain
    category: dependencies
    cadence_days: 30
    last_checked: 2026-07-25
    files:
      - mise.toml # node / aube pins
      - docs/develop/development.md # duplicates the pinned versions in prose
    why: >
      Toolchain pins (node 26.5.0, aube 1.32.0) fall behind releases; the
      development guide repeats them and drifts silently.
    method: |
      Check current node LTS / aube releases; edit mise.toml; mise install;
      sync the versions named in docs/develop/development.md.
    verify: mise install && node -v && aube -V && aube ci && aube test

  - id: ci-actions
    category: dependencies
    cadence_days: 60
    last_checked: 2026-07-25
    files:
      - .github/workflows/cloudflare-pages.yml
      - .github/workflows/dev-to-main-pr.yml
      - .github/workflows/github-release.yml
      - docs/develop/deployment.md # prose mirror of the deploy/CI/release flow
    why: >
      CI action majors, immutable action SHAs, the pinned Cosign binary/verifier
      image, and GitHub runner/CLI behavior all drift with upstream releases.
      docs/develop/deployment.md restates the same flow in prose, and the README
      install route B publishes the cosign verification policy values.
    method: |
      Review all three workflows. Check each action repository for newer majors and
      security advisories. Keep release-workflow actions pinned to full SHAs;
      verify each SHA still matches the documented tag. Review the pinned
      Cosign release, verifier image digest, and verification contract. Keep
      mise-action reading mise.toml and VITE_BUILD_SHA sourced from
      ${{ github.sha }}. For dev-to-main-pr.yml, review the checkout-free gh
      usage, the REST --input payload and already-exists handling, its
      contents: read and pull-requests: write scopes, the workflow_dispatch ref
      guard, and the ahead_by plus commit-tree-SHA promotion guards. Reconfirm
      that a GITHUB_TOKEN-created PR triggers pull_request workflows but may
      leave them held at "Approve workflows to run", and that gh pr create reads
      local branch configuration (so this workflow must use gh api --input
      without checkout). Reconfirm that the repository-wide setting allowing
      Actions to create and approve pull requests is enabled. Reconcile
      docs/develop/deployment.md with the workflows, and the cosign verify-blob
      policy values quoted in README.md / README.ja.md (certificate identity,
      OIDC issuer, repository, ref, trigger) with github-release.yml.
    sync: [readme]
    verify: |
      Local only — a freshness sweep must not push:
      mise x \
        github:rhysd/actionlint@v1.7.12 \
        github:koalaman/shellcheck@v0.11.0 -- \
        actionlint .github/workflows/*.yml
      Extract the run block from .github/workflows/dev-to-main-pr.yml without
      YAML indentation and pipe it to:
      mise x \
        github:rhysd/actionlint@v1.7.12 \
        github:koalaman/shellcheck@v0.11.0 -- \
        shellcheck -s bash -
      rg -n 'uses:|cosign-release:' .github/workflows/*.yml, then
      git ls-remote --exit-code <action repo> <tag> for every referenced tag
      and confirm pinned release-workflow SHAs match.
      If a recent user-authorized CI run exists, confirm it is green.
      Otherwise report the unit as blocked and leave last_checked unchanged.

