      - scripts/serve-dist.mjs # header-aware server called directly by the release workflow
      - tests/unit/serve-dist.test.ts # executable containment and server startup contract
    why: >
      CI action majors, immutable action SHAs, the pinned Cosign binary/verifier
      image, and GitHub runner/CLI behavior all drift with upstream releases.
      docs/develop/deployment.md restates the same flow in prose;
      docs/develop/install-route-a/README.md holds the complete Route A Cosign /
      rebuild procedure while the README publishes only a summary plus a link.
    method: |
      Review all three workflows. Check each action repository for newer majors and
      security advisories. Keep release-workflow actions pinned to full SHAs;
      verify each SHA still matches the documented tag. Review the pinned
      Cosign release, verifier image digest, and verification contract. Keep
      mise-action reading mise.toml and VITE_BUILD_SHA sourced from
      ${{ github.sha }}. For dev-to-main-pr.yml, review the full-history checkout
      used to compute the main/dev merge base and the merged-PR manifest, the
      title/author lookups, content-versus-meta grouping, its contents: read and
      pull-requests: write scopes, the workflow_dispatch ref guard, and the
      ahead_by plus commit-tree-SHA promotion guards. Review the existing-PR
      PATCH, the JSON-file POST through gh api --input, and the already-exists
      race and permission-error handling. Reconfirm that a GITHUB_TOKEN-created
      PR triggers pull_request workflows but may leave them held at "Approve
      workflows to run". Reconfirm that the repository-wide setting allowing
      Actions to create and approve pull requests is enabled. Reconcile
      docs/develop/deployment.md with the workflows. Reconcile
      docs/develop/install-route-a/README.md (mandatory set, cosign verify-blob variables,
      rebuild-and-compare) with the INSTALL.txt heredoc and verification contract
      in github-release.yml; confirm README.md / README.ja.md Route A sections
      remain a summary plus a link to that document (not a second incomplete
      procedure) and that their quoted policy values still match the workflow.
    sync: [readme]
    verify: |
      Local only — a freshness sweep must not push:
      aube run test -- tests/unit/serve-dist.test.ts
      mise x \
        github:rhysd/actionlint@v1.7.12 \
        github:koalaman/shellcheck@v0.11.0 -- \
        actionlint .github/workflows/*.yml
      Extract each run block from .github/workflows/dev-to-main-pr.yml without
      YAML indentation and pipe each one to:
      mise x \
        github:rhysd/actionlint@v1.7.12 \
        github:koalaman/shellcheck@v0.11.0 -- \
        shellcheck -s bash -
      rg -n 'uses:|cosign-release:' .github/workflows/*.yml, then
      git ls-remote --exit-code <action repo> <tag> for every referenced tag
      and confirm pinned release-workflow SHAs match.
      # Relative links in the Route A install document and deployment prose must
      # resolve (README is summary + link; this document is the authority).
      for f in docs/develop/install-route-a/README.md docs/develop/install-route-a/README.ja.md docs/develop/deployment.md; do
        for target in $(rg -oN --no-filename '\]\(([^):#]+)\)' -r '$1' "$f" |
          sort -u); do
          case "$target" in http*|mailto:*) continue;; esac
          test -e "$(dirname "$f")/$target" || echo "MISSING $f -> $target"
        done
      done
      If a recent user-authorized CI run exists, confirm it is green.
      Otherwise report the unit as blocked and leave last_checked unchanged.

