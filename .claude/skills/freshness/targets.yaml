  - id: readme
    category: docs
    cadence_days: 30
    last_checked: 2026-07-26
    files:
      - README.md # general-audience entry point (en)
      - README.ja.md # same content, ja; both must move together
      - SECURITY.md # duplicates release-status claims (repo-public ≠ release-approved)
      - index.html # static meta description; must stay aligned with product claims, never relay-derived
      - docs/develop/deviations.md # dated maintainer decisions (2026-07-23/24) and active-policy wording
    why: >
      Experimental / not-independently-audited claims, active-suite wording,
      the install route B cosign policy values, the documentation list, and the
      dated maintainer decisions in deviations.md all drift. The two READMEs
      are a translation pair and stale independently.
    method: |
      Reconcile the experimental / audit-status wording with
      docs/security/security-review.md §1 and SECURITY.md. Reconcile
      suite/profile wording with the active profile. Confirm the install
      route B cosign policy values still match
      .github/workflows/github-release.yml (unit ci-actions). Confirm the
      documentation list matches the docs/ tree. In deviations.md, drop rows
      that no longer constrain the current implementation — history-only
      entries do not belong there (CLAUDE.md: no backward compatibility).
      Any edit to one README must be mirrored in the other.
    verify: |
      # Every relative link in the registered Markdown files resolves.
      # Must print nothing; --no-filename is required or every match is
      # prefixed with its file and tested as a nonexistent path.
      for f in README.md README.ja.md SECURITY.md docs/develop/deviations.md; do
        for target in $(rg -oN --no-filename '\]\(([^):#]+)\)' -r '$1' "$f" |
          sort -u); do
          case "$target" in http*|mailto:*) continue;; esac
          test -e "$(dirname "$f")/$target" || echo "MISSING $f -> $target"
        done
      done
      # Then read index.html's meta description and confirm it still matches
      # the product claims in the READMEs (no relay-derived wording).

