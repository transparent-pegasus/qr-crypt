      Re-measure on at least Android Chrome + iOS Safari with current browser
      versions and VITE_BUILD_SHA; fill matrix rows. The zxing-wasm scanner
      rows include offline instantiation warmed on scanner mount and the single
      in-attempt preparation retry, which covers both a rejected and a stalled
