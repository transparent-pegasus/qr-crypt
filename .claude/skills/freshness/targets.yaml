      - components.json # https://ui.shadcn.com/schema.json
      - design-system/PROVENANCE.md # plugin path/version provenance
      - src/lib/best-effort-zip.ts # fflate provenance/version claim in header
      - tests/pq-vectors/acvp-fixtures.ts # upstream repo URLs
      # The production app, About routes, and OG image all answered 200 on
      # 2026-07-28. The page links and QR deliberately encode that origin.
      - public/about/index.html # production app URL, GitHub repo and releases/latest, og:url and og:image
      - public/about/install-qr.svg # encodes the production app URL; regenerate whenever that URL moves
    why: >
      External URLs rot; provenance paths/versions drift from reality.
      (README.md and docs/security/threat-model.md carry bare advisory IDs, not URLs —
      advisory-ID resolution belongs to the deps/threat-model units.)
      The landing page's install QR is an opaque mirror of the production
      URL: a stale one silently sends readers to the wrong origin.
    method: |
      HEAD-check the listed URLs (curl -I). design-system files are archival:
      fix only if regenerating, and keep external font URLs out of app CSS.
      Confirm provenance claims (fflate version, plugin path) still match reality.
      Decode public/about/install-qr.svg (or regenerate it with
      `aube run qrcode -- -t svg -e M -o public/about/install-qr.svg <url>`)
      and confirm it still matches the production URL in the page's own link.
    verify: All checked URLs respond, or the entry is annotated as dead/archival.

invariants:
  # Check-only guards. A sweep VERIFIES these; it must never "update" them
  # in the name of freshness. Violations are release blockers.
  - id: boot-allowlist-append-only
    files:
      - src/app/boot/boot-controller.ts
      - src/lib/frame-bytes.ts
      - src/lib/frame-interval.ts
      - src/storage/preferences-repository.ts
    rule: >
      The boot read-allowlist (algorithms incl. legacy RSA-HYBRID/MLKEM768_*,
      profiles ["balanced","maximum"], and numeric density/interval contracts)
      is APPEND-ONLY. Every admitted density value (100–1,000B in 100B steps)
      and interval value (200–1,000ms in 100ms steps plus 2,000ms) must be
      boot-readable, as must every historical density integer 100–900 and
      interval integer 150–2,000 together with 2,500/3,000. The repository
      must preserve the exact 1000B/200ms default and 100B/2000ms compatible
      pairs, and canonicalize every other boot-readable historical
      combination (including a missing member) to the default pair before
      strict preference validation. Per-field historical normalizers remain
      present, current preference patches supply both members of one exact
      pair, environment writes remain strict, and per-artifact effective
      clamps are never persisted. Dropping an old id/value, narrowing a read
      range, or losing this pair canonicalization makes stored preferences
      unreadable → preferencesReadFailed → wipeOnOnline forced true → a later
      network-confirmed contact can wipe user data.
    verify: >
      aube run test -- tests/unit/qr-density-safety.test.ts
      tests/integration/storage.test.ts tests/ui/boot-controller.test.tsx
  - id: vocabulary-append-only
    files:
      - src/schemas/domain.ts
    rule: >
      PQ_PROFILE_IDS, algorithm ids, and WIRE_SUITES hold the full historical
      vocabulary. Append new ids; never remove old ones while stored rows or
      wire payloads can still carry them.
    verify: aube run typecheck && aube run test:pq
  - id: wire-suite-mappings-retained
    files:
      - src/crypto/pq/suites.ts
    rule: >
      resolveSuite/suiteComponents stay exhaustive over all WIRE_SUITES
      (768/65 and 1024/87). Policy changes touch ACTIVE_PROFILE /
      assertActiveSuite only.
    verify: aube run test:pq -- tests/pq/maximum-policy-boundaries.test.ts
  - id: legacy-read-normalization
    files:
      - src/storage/preferences-repository.ts
      - src/lib/frame-bytes.ts
      - src/lib/frame-interval.ts
    rule: >
      normalizeLegacyStoredPreferences keeps recognizing historical stored
      values (balanced, legacy algorithm strings, every historical density
      integer 100–900, and interval integer 150–2,000 plus 2,500/3,000).
      It preserves the two exact generated-display preference pairs and
      canonicalizes every other boot-readable historical combination,
      including either missing member, to the 1000B/200ms default before
      validation, while retaining the per-field historical normalization
      paths. The active profile and atomic preference-pair write allowlists
      stay stricter than the boot read allowlists.
    verify: >
      aube run test -- tests/unit/qr-density-safety.test.ts
      tests/integration/storage.test.ts
  - id: retired-profile-negative-tests
    files:
      - tests/pq/maximum-policy-boundaries.test.ts
    rule: >
      Negative coverage for balanced/768 rejection stays as long as the ids
      exist in domain.ts; extend when new profiles retire, never delete.
    verify: aube run test:pq -- tests/pq/maximum-policy-boundaries.test.ts
  - id: reachability-sentinel-lockstep
    files:
      - public/reachability-sentinel.txt
      - src/app/boot/boot-contract.ts
      - vite.config.ts # SW must NEVER precache/cache the sentinel
      - public/_headers # sentinel route stays no-store
    rule: >
      Sentinel body ("QR-CRYPT-REACHABLE") and REACHABILITY_SENTINEL_BODY/_PATH
      change only together, with a coordinated deploy — the sentinel gates the
      wipe path. The service worker must never serve it from cache: the
      vite.config.ts runtimeCaching route for it stays NetworkOnly, the
      sentinel is excluded from precache globPatterns, and public/_headers
      keeps Cache-Control: no-store on the sentinel route. A cached sentinel
      can fake "network-confirmed" while offline and trigger a wipe.
    verify: |
      test "$(cat public/reachability-sentinel.txt)" = "$(rg -o 'REACHABILITY_SENTINEL_BODY = "([^"]+)"' -r '$1' src/app/boot/boot-contract.ts)"
      && rg -q 'NetworkOnly' vite.config.ts
      && ! rg -q 'reachability-sentinel' <(rg -o 'globPatterns:[^]]*]' vite.config.ts)
      && rg -A2 'reachability-sentinel' public/_headers | rg -q 'no-store'
      && aube run test -- tests/ui/boot-controller.test.tsx
  - id: build-sha-placeholder
    files:
      - .env.example
    rule: >
      VITE_BUILD_SHA stays "development" in .env.example; real build identity
      is injected by CI (${{ github.sha }}). Never hardcode a real SHA.
    verify: rg -n 'VITE_BUILD_SHA=development' .env.example

excluded:
  # Listed so "missing" entries are known-intentional, not oversights.
  - path: dist/**
    reason: Build output (sw.js, workbox-*.js, manifest.webmanifest) — regenerated by every aube build:prod; never hand-edited, gitignored.
  - path: .tmp/**
    reason: Gitignored scratch/plans; historical by design.
  - path: node_modules/**
    reason: Vendored; refreshed via the deps unit.
  - path: test-results/**
    reason: Generated by test runs.
  - path: design-system/pages/**
    reason: Archival design exports (describe the retired RSA-era UI by design); superseded by the live app, never refreshed.
  - path: .claude/skills/**
    reason: Agent tooling docs (herdr/orchestration/freshness itself); not product surface. This registry's own revision is tracked by its updated field.
