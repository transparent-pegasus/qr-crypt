  - id: size-goldens
    category: crypto
    cadence_days: 90 # also on schema / plaintext-limit / encoding change
    last_checked: 2026-07-26
    files:
      - src/lib/limits.ts # measured CBOR/OCF2 sizes and active 200–1,000B density grid / minimum
      - src/lib/frame-bytes.ts # active density set and the append-only boot-readable range
      - src/lib/frame-interval.ts # persisted/displayed QR interval policy grid
      - tests/pq/maximum-artifact-size.golden.test.ts # active density / clamp / boot-readable fixtures
      - src/schemas/env-schema.ts # golden size guard at the maximum selectable density
      - .env.prod # runtime crypto/framing policy and shipped 200B density default
      - .env.example # same density default, kept in step with .env.prod
    why: >
      Measured byte/frame tables (dated 2026-07-23) are cited by
      security-review and limits comments; env-schema.ts carries the
      golden-derived fixed-bytes constant and .env.prod the production policy
      defaults. All stale when wire encoding, schema, or plaintext limits change.
    method: |
      Re-run the golden test; if intentional drift, update fixtures, the
      comment table in limits.ts, MAXIMUM_SIGNED_ARTIFACT_FIXED_BYTES in
      env-schema.ts, and the .env.prod/.env.example defaults together, then
      sync the copy of the table in docs/security/security-review.md.
      Verify the active preference-controlled density grid 200–1,000B in 100B
      steps for messages, OCI2, OCP2, and OCS2 (200B shipped default; active
      writes reject off-grid values such as 250B); the grid-rounded
      per-artifact minimum clamped to the 200B active floor; the independent
      25,600B absolute artifact ceiling; the 1,000B per-chunk ceiling; and the
      1,591-character worst-metadata payload against EC-Q v40 capacity 1,663.
      Confirm the append-only boot-readable range still accepts every
      historical density integer 100–900 and repository loading normalizes
      readable retired values onto the active grid. Confirm the selectable
      interval grid is 200–1,000ms in 100ms steps with a 1,000ms default, while
      boot readability and repository normalization retain every historical
      interval integer 150–2,000 plus 2,500/3,000. Keep limits.ts, env-schema.ts,
      both env files, docs/spec/qr-protocol-v2.md, docs/security/security-review.md, and the
      golden test in agreement.
    verify: aube test:pq -- tests/pq/maximum-artifact-size.golden.test.ts
    sync: [security-review]

