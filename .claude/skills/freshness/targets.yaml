  - id: toolchain
    category: dependencies
    cadence_days: 30
    last_checked: 2026-07-25
    files:
      - mise.toml # node / aube pins
      - docs/develop/development.md # duplicates the pinned versions in prose
    why: >
      Toolchain pins in mise.toml fall behind releases; the development guide
      repeats them and drifts silently.
    method: |
      mise outdated --bump node aube
      It prints each pinned version next to the latest release, so any row whose
      last column exceeds mise.toml is the update signal. Plain `mise outdated`
      (no --bump) is blind here: an exact pin is its own latest. The pins follow
      the node current line, not LTS.
      When moving a pin: edit mise.toml; mise install; sync the versions named
      in docs/develop/development.md.
    verify: mise install && node -v && aube -V && aube ci && aube test

  - id: ci-actions
    category: dependencies
    cadence_days: 60
    last_checked: 2026-07-28
    files:
      - .github/workflows/cloudflare-pages.yml
      - .github/workflows/dev-to-main-pr.yml
      - .github/workflows/github-release.yml
      - docs/develop/deployment.md # prose mirror of the deploy/CI/release flow
