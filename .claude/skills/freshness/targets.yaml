      the recorded commit and compare their SHA-256 against the "// SHA-256:"
      values in acvp-fixtures.ts (this catches fixtures regenerated from the
      SUT, which aube test:pq-vectors alone cannot). Then: aube test:pq-vectors
    constraint: Expected values come only from upstream ACVP data, never from the SUT.

  - id: ui-security-copy
    category: security-knowledge
    cadence_days: 90
    last_checked: 2026-08-02
    files:
      - src/i18n/messages.ts # canonical disclosure copy, en + ja (settings.security.*, gate.*, offlineAck.*, keys.* banners)
      - src/pages/settings-page.tsx # "About security" disclosures (renders catalog keys)
      - src/components/key-add-dialog.tsx # experimental / not-independently-audited banners
      - src/components/online-gate.tsx # offline-switch compromise-assumption copy
      - src/components/offline-ack-shell.tsx # "a connected device can always be compromised" copy
      - public/about/index.html # landing page, en source of record: AES-256 default, ML-KEM as KEM, wipe honesty (attempts / Rev. 2)
      - public/about/messages.js # ja translation of the same landing-page claims
    why: >
      In-app disclosures (noble unaudited, JS side-channel caveat, wipe
      honesty, feature rows) mirror docs; they stale when audit status,
      active policy, or threat model change. The copy itself lives in the
      i18n catalog (both locales must move together). The public landing page
      states the same claims to non-engineers (AES default, ML-KEM as key
      encapsulation, wipe as best-effort with NIST SP 800-88 Rev. 2), so it
      moves with them.
    method: |
      Diff the disclosure copy (both locales in src/i18n/messages.ts) against
      docs/security/security-review.md and docs/security/threat-model.md; update banners when
      audit/release status moves. Re-read the landing page's AES-256 /
      ML-KEM / wipe honesty wording against the same docs, and keep
      public/about/index.html and messages.js in step — the English text lives
      only in the HTML, the other locales only in messages.js.
    verify: aube run test -- tests/ui/keys-settings.test.tsx tests/ui/online-gate.test.tsx tests/ui/offline-ack.test.tsx tests/unit/about-page-i18n.test.ts

  - id: readme
    category: docs
    cadence_days: 30
    last_checked: 2026-08-03
    files:
      - README.md # general-audience entry point (en)
      - README.ja.md # same content, ja; both must move together
      - SECURITY.md # duplicates release-status claims (repo-public ≠ release-approved)
      - index.html # static meta description; must stay aligned with product claims, never relay-derived
      - docs/develop/deviations.md # dated maintainer decisions and active-policy wording
    why: >
      Experimental / not-independently-audited claims, active-suite wording,
      the install route A cosign policy values, the user-selected display
      compatibility preference, per-artifact effective clamps, PNG/ZIP export
      behaviour, the documentation list, and the dated
      maintainer decisions in deviations.md all drift. The two READMEs are a
      translation pair and stale independently.
    method: |
      Reconcile the experimental / audit-status wording with
      docs/security/security-review.md §1 and SECURITY.md. Reconcile
      suite/profile wording, per-algorithm plaintext ceilings, the atomic
      default/compatible display preference pairs, per-artifact effective
      clamps, the independent relay playback cadence, and PNG/ZIP export
      behaviour with the active implementation. Confirm the install route A
      cosign policy values still match
      .github/workflows/github-release.yml (unit ci-actions). Confirm the
      documentation list matches the docs/ tree. In deviations.md, drop rows
      that no longer constrain the current implementation — history-only
      entries do not belong there (CLAUDE.md: no backward compatibility).
      Any edit to one README must be mirrored in the other.
    verify: |
      # Every relative link in the registered Markdown files resolves.
      # Must print nothing; --no-filename is required or every match is
      # prefixed with its file and tested as a nonexistent path.
      for f in README.md README.ja.md SECURITY.md docs/develop/deviations.md docs/develop/install-route-a/README.md docs/locales/ja/develop/install-route-a/README.md; do
        for target in $(rg -oN --no-filename '\]\(([^):#]+)\)' -r '$1' "$f" |
          sort -u); do
          case "$target" in http*|mailto:*) continue;; esac
          test -e "$(dirname "$f")/$target" || echo "MISSING $f -> $target"
        done
      done
      # Then read index.html's meta description and confirm it still matches
      # the product claims in the READMEs (no relay-derived wording).

  - id: external-links
    category: links
    cadence_days: 180
    last_checked: 2026-08-02
    files:
      - components.json # https://ui.shadcn.com/schema.json
      - design-system/PROVENANCE.md # plugin path/version provenance
      - src/lib/best-effort-zip.ts # fflate provenance/version claim in header
      - tests/pq-vectors/acvp-fixtures.ts # upstream repo URLs
      # The production app, About routes, and OG image all answered 200 on
      # 2026-07-28. The page links and QR deliberately encode that origin.
      - public/about/index.html # production app URL, GitHub repo and releases/latest, og:url and og:image
      - public/about/install-qr.svg # encodes the production app URL; regenerate whenever that URL moves
    why: >
      External URLs rot; provenance paths/versions drift from reality.
      (README.md and docs/security/threat-model.md carry bare advisory IDs, not URLs —
      advisory-ID resolution belongs to the deps/threat-model units.)
      The landing page's install QR is an opaque mirror of the production
      URL: a stale one silently sends readers to the wrong origin.
    method: |
      HEAD-check the listed URLs (curl -I). design-system files are archival:
      fix only if regenerating, and keep external font URLs out of app CSS.
      Confirm provenance claims (fflate version, plugin path) still match reality.
      Decode public/about/install-qr.svg (or regenerate it with
      `aube run qrcode -- -t svg -e M -o public/about/install-qr.svg <url>`)
      and confirm it still matches the production URL in the page's own link.
    verify: All checked URLs respond, or the entry is annotated as dead/archival.

invariants:
  # Check-only guards. A sweep VERIFIES these; it must never "update" them
  # in the name of freshness. Violations are release blockers.
  # boot-allowlist-append-only is split: numeric display history and the
  # read-only RSA-HYBRID safety exception are guarded independently below.
  # Other retired crypto/profile vocabulary is gone from active boundaries.
  # policy changed 2026-08-01 by owner request, no-compatibility vocabulary purge, see .tmp/design-20260801-sym-v2-and-legacy-removal.md
  - id: display-preference-reads-append-only
    files:
      - src/app/boot/boot-controller.ts
      - src/lib/frame-bytes.ts
      - src/lib/frame-interval.ts
      - src/storage/preferences-repository.ts
    rule: >
      The boot read-allowlist for numeric display preferences is APPEND-ONLY.
      Every admitted density value (100–1,000B in 100B steps) and interval
      value (200–1,000ms in 100ms steps plus 2,000ms) must be boot-readable,
      as must every historical density integer 100–900 and interval integer
      150–2,000 together with 2,500/3,000. The repository must preserve the
      exact 1000B/200ms default and 100B/2000ms compatible pairs, and
      canonicalize every other boot-readable historical combination
      (including a missing member) to the default pair before strict
      preference validation. Per-field historical normalizers remain present,
      current preference patches supply both members of one exact pair,
      environment writes remain strict, and per-artifact effective clamps are
      never persisted. Dropping an old value, narrowing a read range, or
      losing this pair canonicalization makes stored preferences unreadable →
      preferencesReadFailed → wipeOnOnline forced true → a later
      network-confirmed contact can wipe user data. Algorithm and profile ids
      are governed separately by boot-retired-rsa-read-safety,
      vocabulary-single-active, and removed-vocabulary-rejected.
    verify: >
      aube run test -- tests/unit/qr-density-safety.test.ts
      tests/integration/storage.test.ts tests/ui/boot-controller.test.tsx
  - id: boot-retired-rsa-read-safety
    files:
      - src/app/boot/boot-controller.ts
      - src/storage/preferences-repository.ts
      - tests/integration/storage.test.ts
    rule: >
      Boot's stored-preference read allowlist retains RSA-HYBRID solely so an
      old preference row cannot become unreadable, force wipeOnOnline=true,
      and expose protected data to a later network-confirmed wipe. The normal
      repository must discard that identifier and return the active A256GCM
      default while preserving an explicitly stored wipeOnOnline=false. No
      active domain union, preference write, cryptographic dispatch, or wire
      contract may restore RSA.
    verify: aube run test -- tests/integration/storage.test.ts
  - id: vocabulary-single-active
    # policy changed 2026-08-01 by owner request, no-compatibility vocabulary purge, see .tmp/design-20260801-sym-v2-and-legacy-removal.md
    files:
      - src/schemas/domain.ts
    rule: >
      ML_KEM_ALGORITHMS, ML_DSA_ALGORITHMS, PQ_PROFILE_IDS, WIRE_SUITES, and
      SYM_SUITE contain only "ML-KEM-1024", "ML-DSA-87", "maximum",
      "ML-KEM-1024+ML-DSA-87+HKDF-SHA256+A256GCM", and
      "HKDF-SHA256+A256GCM", respectively. No removed identifier remains in
      an active domain union.
    verify: aube run typecheck && aube run test:pq
  - id: wire-suite-mappings-retained
    # policy changed 2026-08-01 by owner request, no-compatibility vocabulary purge, see .tmp/design-20260801-sym-v2-and-legacy-removal.md
    files:
      - src/crypto/pq/suites.ts
    rule: >
      resolveSuite("ML-KEM-1024", "ML-DSA-87") returns the single WIRE_SUITES
      entry, and suiteComponents returns that same algorithm pair. No other
      mapping is retained.
    verify: aube run test:pq -- tests/pq/maximum-policy-boundaries.test.ts
  # Legacy numeric display normalization lives here; the read-only RSA
  # preference safety path is guarded independently above.
  # policy changed 2026-08-01 by owner request, no-compatibility vocabulary purge, see .tmp/design-20260801-sym-v2-and-legacy-removal.md
  - id: display-preference-normalization
    files:
      - src/storage/preferences-repository.ts
      - src/lib/frame-bytes.ts
      - src/lib/frame-interval.ts
    rule: >
      normalizeLegacyStoredPreferences keeps recognizing every historical
      stored density integer 100–900 and interval integer 150–2,000 plus
      2,500/3,000. It preserves the two exact generated-display preference
      pairs and canonicalizes every other boot-readable historical
      combination, including either missing member, to the 1000B/200ms
      default before validation, while retaining the per-field historical
      normalization paths. The atomic preference-pair write allowlist stays
      stricter than the boot read allowlist.
    verify: >
      aube run test -- tests/unit/qr-density-safety.test.ts
      tests/integration/storage.test.ts
  - id: removed-vocabulary-rejected
    # policy changed 2026-08-01 by owner request, no-compatibility vocabulary purge, see .tmp/design-20260801-sym-v2-and-legacy-removal.md
    files:
      - tests/pq/maximum-policy-boundaries.test.ts
    rule: >
      Active decoders, validators, imports, storage writes, and wire paths
      reject the removed identifiers enumerated here: v1 prefixes,
      ML-KEM-768, ML-DSA-65, balanced, and unsigned suite strings. Boot rejects
      retired algorithm values it interprets except for the separate
      read-only RSA-HYBRID safety exception; removed preference fields are
      ignored as unknown and omitted by the repository. Negative tests retain
      every applicable rejection path. RSA safety is governed by
      boot-retired-rsa-read-safety.
    verify: >
      aube run test:pq -- tests/pq/maximum-policy-boundaries.test.ts &&
      aube run test -- tests/unit/payload-qr.test.ts tests/unit/relay-frames.test.ts
  - id: reachability-sentinel-lockstep
    files:
      - public/reachability-sentinel.txt
      - src/app/boot/boot-contract.ts
      - vite.config.ts # SW must NEVER precache/cache the sentinel
      - public/_headers # sentinel route stays no-store
    rule: >
      Sentinel body ("QR-CRYPT-REACHABLE") and REACHABILITY_SENTINEL_BODY/_PATH
      change only together, with a coordinated deploy — the sentinel gates the
      wipe path. The service worker must never serve it from cache: the
      vite.config.ts runtimeCaching route for it stays NetworkOnly, the
      sentinel is excluded from precache globPatterns, and public/_headers
      keeps Cache-Control: no-store on the sentinel route. A cached sentinel
      can fake "network-confirmed" while offline and trigger a wipe.
    verify: |
      test "$(cat public/reachability-sentinel.txt)" = "$(rg -o 'REACHABILITY_SENTINEL_BODY = "([^"]+)"' -r '$1' src/app/boot/boot-contract.ts)"
      && rg -q 'NetworkOnly' vite.config.ts
      && ! rg -q 'reachability-sentinel' <(rg -o 'globPatterns:[^]]*]' vite.config.ts)
      && rg -A2 'reachability-sentinel' public/_headers | rg -q 'no-store'
      && aube run test -- tests/ui/boot-controller.test.tsx
  - id: build-sha-placeholder
    files:
      - .env.example
    rule: >
      VITE_BUILD_SHA stays "development" in .env.example; real build identity
      is injected by CI (${{ github.sha }}). Never hardcode a real SHA.
    verify: rg -n 'VITE_BUILD_SHA=development' .env.example

excluded:
  # Listed so "missing" entries are known-intentional, not oversights.
  - path: dist/**
    reason: Build output (sw.js, workbox-*.js, manifest.webmanifest) — regenerated by every aube build:prod; never hand-edited, gitignored.
  - path: .tmp/**
    reason: Gitignored scratch/plans; historical by design.
  - path: node_modules/**
    reason: Vendored; refreshed via the deps unit.
  - path: test-results/**
    reason: Generated by test runs.
  - path: design-system/pages/**
    reason: Archival design exports (describe the retired RSA-era UI by design); superseded by the live app, never refreshed.
  - path: .claude/skills/**
    reason: Agent tooling docs (herdr/orchestration/freshness itself); not product surface. This registry's own revision is tracked by its updated field.
