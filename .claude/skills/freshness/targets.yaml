  - id: browser-support
    category: platform
    cadence_days: 60
    last_checked: null
    files:
      - docs/develop/browser-matrix.md # release-gate device measurements
      - src/app/App.tsx # UNSUPPORTED_BROWSER gate copy
      - src/lib/feature-detect.ts # WebCrypto/IDB/camera/SW probes
      - src/hooks/use-qr-reader-readiness.ts # bounded reader-before-camera gate and failure classification
      - docs/spec/qr-protocol-v2.md # generated-display preferences, effective clamps, and QR capacity claims
    why: >
      Browser/OS releases invalidate measured rows (未計測 cells), support
      claims, and feature-detection assumptions.
    method: |
      Re-measure on at least Android Chrome + iOS Safari with current browser
      versions and VITE_BUILD_SHA; fill matrix rows. The zxing-wasm scanner
      rows exercise the reader-before-camera contract: the offline application
      starts the shared warm-up before a scan surface opens, the online relay
      starts it only after capture opens, and startQrScan refuses every
      non-ready module state before getUserMedia or readBarcodes. Verify the
      30-second gate reaches a visible terminal state, failed preparation
      remains latched for the document, runtime classification is bounded to
      two seconds, failed offers reload, blocked does not, and both the scanner
      panel and open relay dialog announce those states. Confirm successful
      preparation uses only the precached same-origin WASM and no retry or CDN
      path remains. Measure both user-selected
      generated-display preferences: switch off is the shipped 1000B/200ms
      default, and switch on is the 100B/2000ms compatible preference. Exercise
      per-artifact effective density clamps and verify the raised value is not
      persisted; at the 1000B density floor, verify the switch still changes
      only the dwell. Include poor light and refocus recovery. For each
      preference, record the actual full-cycle time separately from the
      configured dwell, actual start-to-start decode cadence, p95 decode
      duration and long tasks, sustained CPU/thermal behaviour, teardown
      latency, sender-side version 40 render completion time, and
      post-downscale decoder dimensions (camera resolution is not a
      substitute). Measure local reader usability independently; it does not
      select the display preference. If p95 decode is a long task, move it to
      a dedicated Worker. Re-check
      detectFeatures() assumptions against MDN/caniuse for target browsers;
      update gate copy if reality moved. Align profile names in the matrix
      with the active profile. Re-run aube bench:pq and replace the "Node
      reference bench" table (dated development-machine values) in the same
      document. Reconcile the README "Requirements" sections (target browsers,
      Web Crypto / IndexedDB gate, WebAssembly decoder behaviour) with
      detectFeatures(), App.tsx, and src/qr/camera/reader-module.ts.
    verify: aube bench:pq && aube test:e2e && aube test -- tests/ui/app-shell.test.tsx
    sync: [readme]

