name: Release main build

on:
  push:
    branches:
      - main

permissions: {}

# Rollout prerequisite: first enable repository Release immutability, then set
# the repository Actions variable RELEASE_IMMUTABILITY_ENABLED to literal true.
# The variable is a fail-closed operator acknowledgement; isImmutable and
# GitHub's release attestations are independently checked after publication.

# A distinct group per source commit prevents a newer push from cancelling or
# replacing an older main commit's release.
concurrency:
  group: release-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  EXPECTED_REPOSITORY: transparent-pegasus/qr-crypt
  EXPECTED_WORKFLOW_IDENTITY: https://github.com/transparent-pegasus/qr-crypt/.github/workflows/github-release.yml@refs/heads/main
  COSIGN_VERSION: v3.1.3
  COSIGN_VERIFY_IMAGE: ghcr.io/sigstore/cosign/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8 # v3.1.3

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VITE_BUILD_SHA: ${{ github.sha }}
    outputs:
      archive-name: ${{ steps.package.outputs.archive_name }}
      bundle-name: ${{ steps.package.outputs.bundle_name }}
      package-artifact-id: ${{ steps.upload-package.outputs.artifact-id }}
      release-tag: ${{ steps.package.outputs.release_tag }}
      version: ${{ steps.package.outputs.version }}
      tested-archive-sha256: ${{ steps.test-package.outputs.tested_archive_sha256 }}

    steps:
      - name: Checkout the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up mise and project tools
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install: true
          cache: true

      - name: Install frozen dependencies
        run: aube ci

      - name: Audit dependencies
        run: aube audit

      - name: Type check
        run: aube run typecheck

      - name: Lint
        run: aube run lint

      - name: Unit tests
        run: aube run test -- --maxWorkers=2

      - name: Post-quantum known-answer tests
        run: aube run test:pq-vectors -- --maxWorkers=2

      - name: Post-quantum integration tests
        run: aube run test:pq -- --maxWorkers=2

      - name: Multipart QR tests
        run: aube run test:qr-multipart -- --maxWorkers=2

      - name: Build production PWA
        run: aube run build:prod

      - name: Verify production build determinism
        run: bash scripts/release/verify-build-determinism.sh

      - name: Validate and package the static PWA
        id: package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/release/package-static-pwa.sh

      - name: Install Playwright Chromium
        run: aube exec playwright install --with-deps chromium

      - name: E2E-test the exact packaged PWA
        id: test-package
        env:
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        run: bash scripts/release/test-packaged-pwa.sh

      - name: Upload unsigned release payload
        id: upload-package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qr-crypt-release/${{ steps.package.outputs.archive_name }}
            ${{ runner.temp }}/qr-crypt-release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign:
    name: Sign package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write
    outputs:
      signature-artifact-id: ${{ steps.upload-signature.outputs.artifact-id }}

    steps:
      - name: Download package by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.package-artifact-id }}
          path: ${{ runner.temp }}/unsigned-release

      - name: Verify package checksum
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive-name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unsigned-release"
          [[ -f "$ARCHIVE_NAME" && -f SHA256SUMS ]]
          [[ "$(find . -maxdepth 1 -type f | wc -l)" -eq 2 ]]
          sha256sum -c SHA256SUMS

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign and verify the exact ZIP
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive-name }}
          BUNDLE_NAME: ${{ needs.build.outputs.bundle-name }}
          SOURCE_SHA: ${{ github.sha }}
          TESTED_ARCHIVE_SHA256: ${{ needs.build.outputs.tested-archive-sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unsigned-release"
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TESTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$TESTED_ARCHIVE_SHA256" "$ARCHIVE_NAME" | sha256sum -c -

          cosign sign-blob "$ARCHIVE_NAME" \
            --bundle "$BUNDLE_NAME" \
            --yes
          cosign verify-blob "$ARCHIVE_NAME" \
            --bundle "$BUNDLE_NAME" \
            --certificate-identity "$EXPECTED_WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "$EXPECTED_REPOSITORY" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-sha "$SOURCE_SHA" \
            --certificate-github-workflow-trigger "push"

      - name: Upload signature bundle
        id: upload-signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-release/${{ needs.build.outputs.bundle-name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish fail-closed prerelease
    needs:
      - build
      - sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      # This privileged job deliberately performs no checkout and invokes no
      # third-party action. Inline code downloads immutable handoffs by ID.
      - name: Publish or verify the commit release
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive-name }}
          BUNDLE_NAME: ${{ needs.build.outputs.bundle-name }}
          GH_TOKEN: ${{ github.token }}
          IMMUTABILITY_ACKNOWLEDGED: ${{ vars.RELEASE_IMMUTABILITY_ENABLED }}
          PACKAGE_ARTIFACT_ID: ${{ needs.build.outputs.package-artifact-id }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SIGNATURE_ARTIFACT_ID: ${{ needs.sign.outputs.signature-artifact-id }}
          SOURCE_SHA: ${{ github.sha }}
          TESTED_ARCHIVE_SHA256: ${{ needs.build.outputs.tested-archive-sha256 }}
        run: |
          set -euo pipefail

          fail() {
            printf 'release publication error: %s\n' "$*" >&2
            exit 1
          }

          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] ||
            fail "unexpected repository: $GITHUB_REPOSITORY"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            fail "source SHA is invalid"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] ||
            fail "release version is invalid"
          [[ "$RELEASE_TAG" == "v${RELEASE_VERSION}-main.g${SOURCE_SHA}" ]] ||
            fail "release tag does not match version and source SHA"
          [[ "$ARCHIVE_NAME" == "qr-crypt-${RELEASE_TAG}-static-install.zip" ]] ||
            fail "archive name does not match the release tag"
          [[ "$BUNDLE_NAME" == "${ARCHIVE_NAME}.sigstore.json" ]] ||
            fail "signature bundle name does not match the archive"
          [[ "$PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ||
            fail "package artifact ID is invalid"
          [[ "$SIGNATURE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ||
            fail "signature artifact ID is invalid"
          [[ "$TESTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
            fail "tested archive SHA-256 is invalid"

          package_dir="$RUNNER_TEMP/release-package"
          signature_dir="$RUNNER_TEMP/release-signature"
          mkdir -p -- "$package_dir" "$signature_dir"
          package_handoff="$RUNNER_TEMP/package-handoff.zip"
          signature_handoff="$RUNNER_TEMP/signature-handoff.zip"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$PACKAGE_ARTIFACT_ID/zip" \
            > "$package_handoff"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$SIGNATURE_ARTIFACT_ID/zip" \
            > "$signature_handoff"
          [[ -s "$package_handoff" && -s "$signature_handoff" ]] ||
            fail "artifact handoff download is empty"
          unzip -tqq "$package_handoff"
          unzip -tqq "$signature_handoff"

          expected_handoff="$RUNNER_TEMP/expected-handoff"
          actual_handoff="$RUNNER_TEMP/actual-handoff"
          printf '%s\n' "$ARCHIVE_NAME" SHA256SUMS |
            LC_ALL=C sort > "$expected_handoff"
          unzip -Z1 "$package_handoff" |
            LC_ALL=C sort > "$actual_handoff"
          diff -u "$expected_handoff" "$actual_handoff" ||
            fail "package artifact contains unexpected entries"
          printf '%s\n' "$BUNDLE_NAME" > "$expected_handoff"
          unzip -Z1 "$signature_handoff" > "$actual_handoff"
          diff -u "$expected_handoff" "$actual_handoff" ||
            fail "signature artifact contains unexpected entries"
          unzip -qq "$package_handoff" -d "$package_dir"
          unzip -qq "$signature_handoff" -d "$signature_dir"

          archive_path="$package_dir/$ARCHIVE_NAME"
          checksum_path="$package_dir/SHA256SUMS"
          bundle_path="$signature_dir/$BUNDLE_NAME"
          for file in "$archive_path" "$checksum_path" "$bundle_path"; do
            [[ -s "$file" ]] || fail "missing release input: $file"
          done
          [[ "$(find "$package_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq 2 ]] ||
            fail "unexpected file in package handoff"
          [[ "$(find "$package_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2 ]] ||
            fail "non-regular file in package handoff"
          [[ "$(find "$signature_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]] ||
            fail "unexpected file in signature handoff"
          [[ "$(find "$signature_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1 ]] ||
            fail "non-regular file in signature handoff"
          (
            cd "$package_dir"
            sha256sum -c SHA256SUMS
            printf '%s  %s\n' "$TESTED_ARCHIVE_SHA256" "$ARCHIVE_NAME" | sha256sum -c -
          )
          unzip -tqq "$archive_path"
          archive_root="${ARCHIVE_NAME%.zip}"
          install_text="$(unzip -p "$archive_path" "$archive_root/INSTALL.txt")"
          grep -Fq "Source commit: $SOURCE_SHA" <<< "$install_text" ||
            fail "archive identity does not match the triggering commit"

          release_title="QR Crypt $RELEASE_VERSION automated experimental ${SOURCE_SHA:0:12}"
          notes_path="$RUNNER_TEMP/RELEASE_NOTES.md"
          {
            printf '%s\n' \
              "<!-- qr-crypt-automated-release:$SOURCE_SHA -->" \
              '' \
              "Automated experimental build from main commit \`$SOURCE_SHA\`." \
              '' \
              'This build is not independently audited or security-approved. Use only' \
              "\`$ARCHIVE_NAME\` as the static offline deployment bundle. GitHub's" \
              'automatically generated source archives are not install bundles.' \
              '' \
              "Verify the ZIP with \`$BUNDLE_NAME\` and an independently provisioned" \
              "QR Crypt verifier policy, then check \`SHA256SUMS\`. The archive's" \
              "\`INSTALL.txt\` documents the trust bootstrap and offline deployment" \
              'constraints.'
          } > "$notes_path"

          expected_assets=("$ARCHIVE_NAME" "SHA256SUMS" "$BUNDLE_NAME")
          expected_assets_file="$RUNNER_TEMP/expected-assets"
          actual_assets_file="$RUNNER_TEMP/actual-assets"
          printf '%s\n' "${expected_assets[@]}" |
            LC_ALL=C sort > "$expected_assets_file"
          release_json="$RUNNER_TEMP/release.json"
          release_error="$RUNNER_TEMP/release.error"
          tag_json="$RUNNER_TEMP/tag.json"
          tag_error="$RUNNER_TEMP/tag.error"

          assert_exact_published_release() {
            [[ "$(jq -r '.tagName' "$release_json")" == "$RELEASE_TAG" ]] ||
              fail "release tag metadata mismatch"
            [[ "$(jq -r '.name' "$release_json")" == "$release_title" ]] ||
              fail "release title mismatch"
            [[ "$(jq -r '.isDraft' "$release_json")" == "false" ]] ||
              fail "release unexpectedly remains a draft"
            [[ "$(jq -r '.isPrerelease' "$release_json")" == "true" ]] ||
              fail "release is not marked as a prerelease"
            [[ "$(jq -r '.isImmutable' "$release_json")" == "true" ]] ||
              fail "release is published but not immutable"
            jq -e --rawfile expected "$notes_path" \
              '.body == $expected' "$release_json" > /dev/null ||
              fail "release notes mismatch"

            jq -r '.assets[].name' "$release_json" |
              LC_ALL=C sort > "$actual_assets_file"
            diff -u "$expected_assets_file" "$actual_assets_file" ||
              fail "published release assets do not match the allowlist"
          }

          load_published_release_after_publication() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets,body,isDraft,isImmutable,isPrerelease,name,tagName \
                > "$release_json" 2> "$release_error" &&
                [[ "$(jq -r '.isDraft' "$release_json")" == "false" ]] &&
                [[ "$(jq -r '.isImmutable' "$release_json")" == "true" ]]; then
                return
              fi
              sleep 2
            done
            cat "$release_error" >&2
            fail "published immutable release did not become observable"
          }

          assert_exact_draft() {
            [[ "$(jq -r '.tag_name' "$release_json")" == "$RELEASE_TAG" ]] ||
              fail "draft tag metadata mismatch"
            [[ "$(jq -r '.name' "$release_json")" == "$release_title" ]] ||
              fail "draft title mismatch"
            [[ "$(jq -r '.draft' "$release_json")" == "true" ]] ||
              fail "release record is not the expected draft"
            [[ "$(jq -r '.prerelease' "$release_json")" == "true" ]] ||
              fail "draft is not marked as a prerelease"
            [[ "$(jq -r '.immutable // false' "$release_json")" == "false" ]] ||
              fail "draft unexpectedly reports immutable"
            [[ "$(jq -r '.author.login' "$release_json")" == "github-actions[bot]" ]] ||
              fail "draft was not created by GitHub Actions"
            jq -e --rawfile expected "$notes_path" \
              '.body == $expected' "$release_json" > /dev/null ||
              fail "draft notes mismatch"
            jq -e 'all(.assets[]; .state == "uploaded")' \
              "$release_json" > /dev/null ||
              fail "draft contains an asset that is not fully uploaded"

            jq -r '.assets[].name' "$release_json" |
              LC_ALL=C sort > "$actual_assets_file"
            [[ "$(wc -l < "$actual_assets_file")" -eq \
              "$(LC_ALL=C sort -u "$actual_assets_file" | wc -l)" ]] ||
              fail "draft contains duplicate asset names"
            unexpected_assets="$RUNNER_TEMP/unexpected-draft-assets"
            comm -23 "$actual_assets_file" "$expected_assets_file" \
              > "$unexpected_assets"
            [[ ! -s "$unexpected_assets" ]] ||
              fail "draft contains an asset outside the allowlist"
          }

          assert_exact_draft_assets() {
            assert_exact_draft
            diff -u "$expected_assets_file" "$actual_assets_file" ||
              fail "draft release assets are incomplete"
          }

          verify_published_assets() {
            local attempt attestation_log published_dir published_install
            published_dir="$(mktemp -d "$RUNNER_TEMP/published-release.XXXXXX")"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ARCHIVE_NAME" \
              --pattern "SHA256SUMS" \
              --pattern "$BUNDLE_NAME" \
              --dir "$published_dir"
            [[ "$(find "$published_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq 3 ]] ||
              fail "downloaded release has an unexpected asset count"
            [[ "$(find "$published_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3 ]] ||
              fail "downloaded release contains a non-regular asset"
            [[ -s "$published_dir/$BUNDLE_NAME" ]] ||
              fail "published Cosign bundle is empty"
            (
              cd "$published_dir"
              sha256sum -c SHA256SUMS
              printf '%s  %s\n' "$TESTED_ARCHIVE_SHA256" "$ARCHIVE_NAME" | sha256sum -c -
            )
            unzip -tqq "$published_dir/$ARCHIVE_NAME"
            published_install="$(
              unzip -p "$published_dir/$ARCHIVE_NAME" \
                "$archive_root/INSTALL.txt"
            )"
            grep -Fq "Source commit: $SOURCE_SHA" <<< "$published_install" ||
              fail "published archive source identity is incorrect"
            grep -Fq "Release tag: $RELEASE_TAG" <<< "$published_install" ||
              fail "published archive tag identity is incorrect"

            attestation_log="$RUNNER_TEMP/release-attestation.log"
            for attempt in 1 2 3 4 5 6; do
              : > "$attestation_log"
              if gh release verify "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                >> "$attestation_log" 2>&1 &&
                gh release verify-asset "$RELEASE_TAG" \
                  "$published_dir/$ARCHIVE_NAME" \
                  --repo "$GITHUB_REPOSITORY" \
                  >> "$attestation_log" 2>&1 &&
                gh release verify-asset "$RELEASE_TAG" \
                  "$published_dir/SHA256SUMS" \
                  --repo "$GITHUB_REPOSITORY" \
                  >> "$attestation_log" 2>&1 &&
                gh release verify-asset "$RELEASE_TAG" \
                  "$published_dir/$BUNDLE_NAME" \
                  --repo "$GITHUB_REPOSITORY" \
                  >> "$attestation_log" 2>&1; then
                break
              fi
              if [[ "$attempt" -eq 6 ]]; then
                cat "$attestation_log" >&2
                fail "GitHub release attestation did not become verifiable"
              fi
              sleep $((attempt * 5))
            done

            # The pinned verifier container receives neither GH_TOKEN nor a
            # Docker socket; only the three public release files are mounted.
            # mktemp -d creates mode 0700; the cosign image runs as non-root
            # (distroless nonroot), so it cannot open files under a host-owned
            # 0700 bind mount. World-traverse/read is required for verify-blob;
            # the mount remains readonly and holds only public release assets.
            chmod a+rX "$published_dir"
            find "$published_dir" -type f -exec chmod a+r {} +
            docker run --rm \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev \
              --env HOME=/tmp \
              --mount "type=bind,src=$published_dir,dst=/release,readonly" \
              "$COSIGN_VERIFY_IMAGE" \
              verify-blob "/release/$ARCHIVE_NAME" \
              --bundle "/release/$BUNDLE_NAME" \
              --certificate-identity "$EXPECTED_WORKFLOW_IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "$EXPECTED_REPOSITORY" \
              --certificate-github-workflow-ref "refs/heads/main" \
              --certificate-github-workflow-sha "$SOURCE_SHA" \
              --certificate-github-workflow-trigger "push"
          }

          assert_canonical_tag() {
            local context="$1"
            [[ "$(jq -r '.object.type' "$tag_json")" == "commit" ]] ||
              fail "$context: canonical tag is not a lightweight commit tag"
            [[ "$(jq -r '.object.sha' "$tag_json")" == "$SOURCE_SHA" ]] ||
              fail "$context: canonical tag does not resolve to $SOURCE_SHA"
          }

          # GitHub serves ref reads from replicas, so a ref can 404 for a
          # moment after it is written. Retry only that transient absence, and
          # only on an explicit HTTP 404 — a 500 whose text happens to read
          # "not found" is a real error. A ref that reads back with the wrong
          # target is a tag move: it fails on the first readable response
          # rather than being re-polled until some replica agrees.
          read_canonical_tag() {
            local context="$1" attempt
            for attempt in 1 2 3 4 5 6; do
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
                > "$tag_json" 2> "$tag_error"; then
                assert_canonical_tag "$context"
                return 0
              fi
              grep -q 'HTTP 404' "$tag_error" || {
                cat "$tag_error" >&2 || true
                fail "$context: canonical tag read failed"
              }
              [[ "$attempt" -lt 6 ]] || break
              sleep 2
            done
            cat "$tag_error" >&2 || true
            fail "$context: canonical tag did not become readable"
          }

          tag_exists=false
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > "$tag_json" 2> "$tag_error"; then
            tag_exists=true
            [[ "$(jq -r '.object.type' "$tag_json")" == "commit" ]] ||
              fail "canonical tag is not a lightweight commit tag"
            tag_sha="$(jq -r '.object.sha' "$tag_json")"
            [[ "$tag_sha" == "$SOURCE_SHA" ]] ||
              fail "existing tag resolves to $tag_sha instead of $SOURCE_SHA"
          elif ! grep -q 'HTTP 404' "$tag_error"; then
            cat "$tag_error" >&2
            fail "could not determine whether the canonical tag exists"
          fi

          release_exists=false
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,body,isDraft,isImmutable,isPrerelease,name,tagName \
            > "$release_json" 2> "$release_error"; then
            release_exists=true
          elif ! grep -Eqi 'release not found|HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            fail "could not determine whether the release exists"
          fi

          if [[ "$release_exists" == "true" ]]; then
            [[ "$tag_exists" == "true" ]] ||
              fail "release exists without its canonical tag"
            assert_exact_published_release
            verify_published_assets
            printf '%s\n' \
              "Matching same-SHA release verified; no release state was mutated."
            exit 0
          fi

          [[ "$IMMUTABILITY_ACKNOWLEDGED" == "true" ]] ||
            fail "enable Release immutability, then set repository variable RELEASE_IMMUTABILITY_ENABLED=true"

          # The create response is the authoritative ref object, so it is
          # asserted directly instead of read back — the read-back is what
          # raced GitHub's ref replication and failed run 30716158737.
          if [[ "$tag_exists" == "false" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$SOURCE_SHA" > "$tag_json"
          fi
          assert_canonical_tag "canonical tag"

          create_payload="$RUNNER_TEMP/create-release.json"
          create_error="$RUNNER_TEMP/create-release.error"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg title "$release_title" \
            --rawfile body "$notes_path" \
            '{
              tag_name: $tag,
              name: $title,
              body: $body,
              draft: true,
              prerelease: true,
              make_latest: "false"
            }' > "$create_payload"

          if gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            --input "$create_payload" \
            > "$release_json" 2> "$create_error"; then
            :
          else
            # A failed prior attempt may have left the exact automation-owned
            # draft behind. Scan history only after creation fails.
            release_pages="$RUNNER_TEMP/release-pages.json"
            release_matches="$RUNNER_TEMP/release-matches.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > "$release_pages" ||
              fail "could not inspect releases after draft creation failed"
            jq --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)]' \
              "$release_pages" > "$release_matches"
            match_count="$(jq 'length' "$release_matches")"
            if [[ "$match_count" -eq 0 ]]; then
              cat "$create_error" >&2
              fail "draft creation failed and no recoverable release exists"
            fi
            [[ "$match_count" -eq 1 ]] ||
              fail "multiple releases unexpectedly use the canonical tag"
            jq '.[0]' "$release_matches" > "$release_json"

            if [[ "$(jq -r '.draft' "$release_json")" == "false" ]]; then
              load_published_release_after_publication
              assert_exact_published_release
              verify_published_assets
              printf '%s\n' \
                "Matching same-SHA release verified after a create race."
              exit 0
            fi
          fi

          release_id="$(jq -r '.id' "$release_json")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] ||
            fail "draft release ID is invalid"
          assert_exact_draft

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$archive_path#Static offline deployment bundle" \
            "$checksum_path#SHA-256 checksum" \
            "$bundle_path#Sigstore verification bundle"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$release_json"
          assert_exact_draft_assets

          # Close the mutable-draft tag race immediately before publication.
          read_canonical_tag "pre-publication"

          publish_payload="$RUNNER_TEMP/publish-release.json"
          jq -n \
            --arg title "$release_title" \
            --rawfile body "$notes_path" \
            '{
              name: $title,
              body: $body,
              draft: false,
              prerelease: true,
              make_latest: "false"
            }' > "$publish_payload"
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --input "$publish_payload" > /dev/null

          read_canonical_tag "post-publication"

          load_published_release_after_publication
          assert_exact_published_release
          verify_published_assets
