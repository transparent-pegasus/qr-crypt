name: Validate and Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise and project tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: aube ci

      - name: Type check
        run: aube typecheck

      - name: Lint
        run: aube lint

      - name: Unit tests
        run: aube test

      - name: Post-quantum known-answer tests
        run: aube test:pq-vectors

      - name: Post-quantum integration tests
        run: aube test:pq

      - name: Multipart QR tests
        run: aube test:qr-multipart

      - name: Build production PWA
        run: aube build:prod
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise and project tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: aube ci

      - name: Install Playwright Chromium
        run: aube exec playwright install --with-deps chromium

      - name: E2E tests
        run: aube test:e2e
