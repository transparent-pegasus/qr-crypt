name: External security maintenance

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  external-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout assessed dependency pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise and project tools
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install: true
          cache: false

      - name: Install frozen dependencies
        run: aube ci

      - name: Audit dependency advisories
        run: aube audit

      # Still check releases if installation or audit failed, so both external
      # signals remain visible. Failure never updates an installed application.
      - name: Check the assessed post-quantum release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-crypto-release.sh
